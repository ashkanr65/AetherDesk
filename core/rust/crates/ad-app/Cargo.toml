[package]
name = "ad-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Internal crates
ad-core = { path = "../ad-core" }
ad-config = { path = "../ad-config" }
ad-events = { path = "../ad-events" }
ad-session = { path = "../ad-session" }
ad-credential = { path = "../ad-credential" }
ad-ssh = { path = "../ad-ssh" }
ad-sftp = { path = "../ad-sftp" }
ad-tunnel = { path = "../ad-tunnel" }
ad-terminal = { path = "../ad-terminal" }
ad-terminal-render = { path = "../ad-terminal-render" }
ad-display = { path = "../ad-display" }
ad-stream-client = { path = "../ad-stream-client" }
ad-telemetry = { path = "../ad-telemetry" }
ad-plugin-host = { path = "../ad-plugin-host" }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# FFI bindings for Flutter
ffi-support = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[[bin]]
name = "aetherdesk"
path = "src/main.rs"

[lib]
name = "ad_app"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
